[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assertiva"
version = "1.0.0"
description = "Adaptive Test Intelligence & Assurance for coding agents"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
assertiva = "assertiva.cli:main"

[tool.setuptools.packages.find]
include = ["assertiva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's defaults plus fixture projects (their own tests are run by the adapters under test, not collected here)
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]
pythonpath = ["."]
markers = [
    "integration: runs real project tooling in subprocesses (native runner, improve sessions)",
    "artifact: builds and installs wheels",
    "browser: drives a real browser (needs an installed browser build; runs in its own CI job)",
    "jvm: runs a real JVM build (needs a JDK, Maven and resolved dependencies; runs in its own CI job)",
]

[tool.ruff]
# Correctness gate, not a formatter: pyflakes and statement/syntax errors. Fixtures are labeled inputs of the tests
# (some are invalid on purpose) and are not linted. The codebase's style choices (one-line compound statements, named
# lambdas, short loop names) are kept. Bugbear (B) has 23 findings left for a later, reviewed pass.
target-version = "py311"
line-length = 140
extend-exclude = ["tests/fixtures", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E731", "E741"]
