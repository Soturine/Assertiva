name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest build
      - run: python scripts/validate_repo.py
      - run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Smoke installed artifact
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/assertiva" audit-pytest "$GITHUB_WORKSPACE" --output json > assertiva-self-audit.json
