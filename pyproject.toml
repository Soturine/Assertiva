[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assertiva"
version = "0.7.2"
description = "Adaptive Test Intelligence & Assurance for coding agents"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
assertiva = "assertiva.cli:main"

[tool.setuptools.packages.find]
include = ["assertiva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's defaults plus fixture projects (their own tests are run by the adapters under test, not collected here)
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]
pythonpath = ["."]
markers = [
    "integration: runs real project tooling in subprocesses (native runner, improve sessions)",
    "artifact: builds and installs wheels",
    "browser: drives a real browser (needs an installed browser build; runs in its own CI job)",
    "jvm: runs a real JVM build (needs a JDK, Maven and resolved dependencies; runs in its own CI job)",
]
