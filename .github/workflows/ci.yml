name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest pytest-xdist coverage build setuptools django -c constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare the JS adapter fixture once (lockfile, no package hooks)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/js-jest
      - run: python scripts/validate_repo.py
      - name: Fast/core suite
        run: pytest -q -m "not integration and not artifact"
      - name: Integration and artifact suites
        env:
          ASSERTIVA_REQUIRE_JS: "1"
          ASSERTIVA_REQUIRE_DJANGO: "1"
        run: pytest -q -n auto -m "(integration or artifact) and not browser and not jvm"
      - name: Build wheel
        run: python -m build --wheel
      - name: Smoke installed artifact
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl -c "$GITHUB_WORKSPACE/constraints.txt"
          before="$(git status --porcelain)"
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/assertiva" audit "$GITHUB_WORKSPACE" --output json > assertiva-static-audit.json
          cd "$GITHUB_WORKSPACE"
          test "$before" = "$(git status --porcelain)"
      - name: Read-only invariant and qualification from the installed CLI
        run: |
          A="$GITHUB_WORKSPACE/.wheel-smoke/bin/assertiva"
          PY="$(command -v python)"
          F=/tmp/qualify-fixture
          python -c "import sys; sys.path[:0] = ['tests']; from pathlib import Path; import test_m1_integration as m; m.project(Path('$F'), package_data=True)"
          fingerprint() { python -c "import json, sys; from assertiva.workspace import tree_fingerprint; print(json.dumps(tree_fingerprint(sys.argv[1]), sort_keys=True))" "$F"; }
          before="$(fingerprint)"
          cd /tmp
          "$A" audit "$F" --execute --python "$PY" --output json > fixture-audit.json
          ws="$("$A" improve "$F" --python "$PY" --output json | python -c "import json, sys; print(json.load(sys.stdin)['candidate_workspace'])")"
          printf 'from shop import discount\n\n\ndef test_boundary():\n    assert discount(100, "VIP") == 90\n' > "$ws/tests/test_boundary.py"
          "$A" improve "$F" --python "$PY" --output json > fixture-improve.json
          "$A" improve "$F" --discard
          cd "$GITHUB_WORKSPACE"
          test "$before" = "$(fingerprint)"
          python - <<'EOF'
          import json
          audit = json.load(open("/tmp/fixture-audit.json"))["states"]["current"]
          assert [r["status"] for r in audit["runs"]] == ["PASS"], audit["runs"]
          assert [a["status"] for a in audit["artifacts"]] == ["PASS"], audit["artifacts"]
          improve = json.load(open("/tmp/fixture-improve.json"))
          assert improve["states"]["applied"] is None
          assert [c["change_id"] for c in improve["change_set"]["changes"]] == ["tests/test_boundary.py"]
          checks = {c["check"]: c["status"] for s in improve["candidate_qualification"]["stages"] for c in s["checks"]}
          assert checks["ORIGINAL_REGRESSION"] == "PASS" and checks["BUILD_AND_ARTIFACT"] == "PASS", checks
          print("fixture audit + improve qualified; project unchanged")
          EOF

  browser:
    # Real browser evidence in its own slice: the only job that downloads a browser, and only
    # Chromium's headless shell. Other declared projects are evidence of configuration, not runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest -c constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare the Playwright fixture once (lockfile, no package hooks)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/js-playwright
      - name: Install Chromium headless shell only
        run: node tests/fixtures/js-playwright/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Browser evidence
        env:
          ASSERTIVA_REQUIRE_PLAYWRIGHT: "1"
        run: pytest -q -m browser

  java:
    # Real JVM evidence in its own slice: the only job that needs a JDK and Maven's local repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest -c constraints.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tests/fixtures/java-maven/pom.xml
      - name: Resolve the Maven fixture's plugins and dependencies once (the adapter itself runs offline)
        run: |
          mvn -B -ntp -q -f tests/fixtures/java-maven/pom.xml verify
          rm -rf tests/fixtures/java-maven/target
      - name: JVM evidence
        env:
          ASSERTIVA_REQUIRE_JAVA: "1"
        run: pytest -q -m jvm

  compatibility:
    # requires-python >=3.11: the minimum version gets fast feedback and an installed-wheel smoke,
    # not a second full qualification (that would double CI cost for little new evidence).
    name: Python 3.11 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest build setuptools -c constraints.txt
      - name: Fast/core suite on the minimum supported Python
        run: pytest -q -m "not integration and not artifact"
      - name: Wheel installs and the CLI runs on the minimum supported Python
        run: |
          python -m build --wheel
          python -m venv /tmp/py311
          /tmp/py311/bin/python -m pip install dist/*.whl -c "$GITHUB_WORKSPACE/constraints.txt"
          cd /tmp
          /tmp/py311/bin/assertiva audit "$GITHUB_WORKSPACE" --output json > /dev/null

  runtime-self-qualification:
    # Deep deterministic self-qualification of the Assertiva runtime (not a semantic Skill
    # evaluation; see evals/README.md). The installed wheel audits this repository with --execute
    # and qualifies its own wheel. New execution must buy new evidence: the source suites already
    # ran in `validate`, so the runner executes the fast/core suite natively and against the
    # installed wheel (source isolation, environment compatibility, declared dependency closure).
    # On demand and for release tags only.
    name: Runtime self-qualification
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: -m "not integration and not artifact"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest pytest-xdist coverage build setuptools -c constraints.txt
      - name: Build and install wheel
        run: |
          python -m build --wheel
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl -c "$GITHUB_WORKSPACE/constraints.txt"
      - name: Read-only self-audit with native execution and artifact qualification
        run: |
          before="$(git status --porcelain)"
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/assertiva" audit "$GITHUB_WORKSPACE" --execute --python "$(command -v python)" --output json > assertiva-self-audit.json
          cd "$GITHUB_WORKSPACE"
          test "$before" = "$(git status --porcelain)"
          python -c "import json; r=json.load(open('/tmp/assertiva-self-audit.json')); c=r['states']['current']; runs=c['runs']; arts=c['artifacts']; assert runs and all(x['status']=='PASS' for x in runs), runs; assert arts and all(a['status']=='PASS' for a in arts), arts; print(r['status'], [x['invocations'] for x in runs], [(a['artifact'], [k['name'] for k in a['checks']]) for a in arts])"
