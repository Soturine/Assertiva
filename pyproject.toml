[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assertiva"
version = "0.2.0"
description = "Adaptive Test Intelligence & Assurance for coding agents"
requires-python = ">=3.11"

[project.scripts]
assertiva = "assertiva.cli:main"

[tool.setuptools.packages.find]
include = ["assertiva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
